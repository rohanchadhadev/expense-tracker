name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --yes --verbose

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find build -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$APK_PATH" dist/expense-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: dist/expense-tracker.apk

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/expense-tracker.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Expense Tracker (latest build)" \
            --notes "Automated build from commit ${{ github.sha }}."
