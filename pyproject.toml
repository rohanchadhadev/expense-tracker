[project]
name = "expense-tracker"
version = "0.1.0"
description = "Offline-first expense tracker"
requires-python = ">=3.10"
dependencies = [
    "flet==0.86.5",
    "flet-charts==0.86.5",
]

[tool.flet]
org = "com.expensetracker"
product = "Expense Tracker"

[tool.flet.app]
path = "."

[tool.flet.android]
# Build for arm64-v8a only (virtually all Android phones in active use) instead of the
# default arm64-v8a + armeabi-v7a + x86_64 "fat" APK, which roughly triples the size by
# bundling a separate embedded Python runtime + native libs per architecture.
target_arch = ["arm64-v8a"]
